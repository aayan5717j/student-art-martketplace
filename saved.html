<!doctype html><html lang="en"><head>
  <script type="module" src="auth-guard.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved Items - Student Art Hub</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="container" style="padding-top:28px"><section class="dashboard-panel"><span class="eyebrow">Your collection</span><h1>Saved Items</h1><p>Keep the books, art and notes you want to check later.</p></section><section><div id="savedGrid" class="market-grid"></div></section></main>
<script type="module">
import{initializeApp,getApps}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
const cfg={apiKey:"AIzaSyBxD8SLW9z8ndgAJprcGolqivlNUZVYZxc",authDomain:"art-hub-77eb1.firebaseapp.com",databaseURL:"https://art-hub-77eb1-default-rtdb.firebaseio.com",projectId:"art-hub-77eb1"};const app=getApps().length?getApps()[0]:initializeApp(cfg),db=getDatabase(app),box=document.getElementById('savedGrid');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const labels={painting:'Painting',sketch:'Sketch',digital:'Digital Art',craft:'Craft',photography:'Photography',art:'Art',artist:'Artist Showcase',book:'Book',notes:'Handwritten Notes'};
let all=[];function render(){const ids=JSON.parse(localStorage.getItem('hub_saved_listings')||'[]');const items=all.filter(x=>ids.includes(x.id));box.innerHTML=items.length?items.map(x=>`<article class="market-card"><div class="market-image-wrap"><img src="${esc(x.imageUrl||'https://via.placeholder.com/700x500?text=Student+Listing')}" alt="${esc(x.title)}"></div><div class="market-card-body"><span class="category-badge">${esc(labels[x.category]||'Listing')}</span><h3>${esc(x.title||'Untitled')}</h3><div class="market-bottom"><strong>₹${esc(x.price||'—')}</strong><button class="market-btn" data-id="${esc(x.id)}">Remove</button></div></div></article>`).join(''):`<div class="empty-state"><div>♡</div><h3>No saved items yet</h3><p>Tap the heart on a listing to save it here.</p><a class="market-btn" href="home.html">Browse marketplace</a></div>`;box.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const ids=JSON.parse(localStorage.getItem('hub_saved_listings')||'[]').filter(id=>id!==b.dataset.id);localStorage.setItem('hub_saved_listings',JSON.stringify(ids));render();});}
onValue(ref(db,'listings'),s=>{all=Object.values(s.val()||{}).map(x=>({...x,id:x.id}));render();});
</script><script src="hub-enhancements.js"></script><script src="common-nav.js"></script><script src="marketplace-v3.js"></script>
</body></html>
