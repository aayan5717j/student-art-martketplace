<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Sketches — Student Art Hub</title><link rel="stylesheet" href="styles.css"><style>
.sketch-page{max-width:1100px;margin:auto;padding:28px 18px 50px}.sketch-hero{background:#fff;border:1px solid #e7eaf1;border-radius:22px;padding:26px;box-shadow:0 8px 25px rgba(23,32,51,.05);margin-bottom:22px}.sketch-hero h1{margin:5px 0}.sketch-hero p{color:#667085;margin:0}.artist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.artist-card{background:#fff;border:1px solid #e7eaf1;border-radius:18px;padding:16px;box-shadow:0 7px 22px rgba(23,32,51,.05)}.artist-avatar{width:70px;height:70px;border-radius:50%;object-fit:cover;background:#eef2ff;display:grid;place-items:center;color:#3157d5;font-weight:900;font-size:28px;margin-bottom:10px}.artist-card h3{margin:4px 0}.artist-card p{color:#667085;font-size:.86rem;min-height:40px}.artist-card .market-btn{width:100%;box-sizing:border-box}.showcase-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:28px 0 14px}.showcase-head h2{margin:0}.showcase-head p{margin:4px 0 0;color:#667085}@media(max-width:600px){.sketch-page{padding:18px 12px}.showcase-head{align-items:flex-start;flex-direction:column}}
</style></head><body>
<main class="sketch-page">
<section class="sketch-hero"><span class="eyebrow">Creative Corner</span><h1>Custom Sketches 🎨</h1><p>Find a student artist, view their work, and request a custom sketch.</p></section>
<section><div class="showcase-head"><div><h2>Student Artists</h2><p>Artists create their profile from My Profile.</p></div></div><div id="artistList" class="artist-grid"></div></section>
<section><div class="showcase-head"><div><h2>Artist Showcase</h2><p>Only listings uploaded as <b>Artist Showcase</b> appear here.</p></div><a class="market-btn" href="dashboard.html">Showcase your sketch</a></div><div id="artistShowcase" class="market-grid"></div></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
const cfg={apiKey:"AIzaSyBxD8SLW9z8ndgAJprcGolqivlNUZVYZxc",authDomain:"art-hub-77eb1.firebaseapp.com",databaseURL:"https://art-hub-77eb1-default-rtdb.firebaseio.com",projectId:"art-hub-77eb1"};const app=initializeApp(cfg),db=getDatabase(app);const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let users={};onValue(ref(db,"users"),snap=>{users=snap.val()||{};renderArtists();renderShowcase();});
function renderArtists(){const box=$("artistList"),list=Object.entries(users).filter(([id,u])=>u.role==="seller"&&u.artistProfile?.enabled);if(!list.length){box.innerHTML='<div class="empty-state"><div>🎨</div><h3>No artist profiles yet</h3><p>Seller? Open My Profile and create your Artist Profile.</p></div>';return;}box.innerHTML=list.map(([id,u])=>{const a=u.artistProfile||{};const photo=a.photoUrl?`<img class="artist-avatar" src="${esc(a.photoUrl)}" alt="Artist">`:`<div class="artist-avatar">${esc((a.name||u.name||"A").charAt(0).toUpperCase())}</div>`;return `<article class="artist-card">${photo}<h3>${esc(a.name||u.name||"Student Artist")}</h3><div class="category-badge">${esc(a.speciality||"Student Artist")}</div><p>${esc(a.bio||"View this artist's showcase and request a custom sketch.")}</p><a class="market-btn" href="artist.html?id=${encodeURIComponent(id)}">View Artist</a></article>`}).join("");}
function renderShowcase(){const box=$("artistShowcase"),arr=Object.entries(window.__listings||{}).map(([id,x])=>({...x,id})).filter(x=>x.category==="artist").sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));if(!arr.length){box.innerHTML='<div class="empty-state"><div>✏️</div><h3>No artist sketches yet</h3><p>Artists can upload their work from Dashboard → Add Listing → Artist Showcase.</p></div>';return;}box.innerHTML=arr.map(x=>{const u=users[x.sellerId]||{};const a=u.artistProfile||{};return `<article class="market-card"><div class="market-image-wrap"><img src="${esc(x.imageUrl||"https://via.placeholder.com/700x500?text=Artist+Sketch")}" alt="${esc(x.title||"Artist sketch")}" loading="lazy"></div><div class="market-card-body"><span class="category-badge">Artist Showcase</span><h3>${esc(x.title||"Untitled")}</h3><p class="market-meta">By ${esc(a.name||u.name||"Student Artist")}</p><div class="market-bottom"><strong>₹${esc(x.price||"—")}</strong></div><div class="card-actions"><a class="market-btn secondary" href="artist.html?id=${encodeURIComponent(x.sellerId||"")}">View Artist</a><button class="market-btn" data-buy-sketch="${esc(x.id)}">Buy Now</button></div></div></article>`}).join("");box.querySelectorAll("[data-buy-sketch]").forEach(b=>b.onclick=()=>{const x=arr.find(i=>i.id===b.dataset.buySketch);if(x)window.hubBuy?.(x);});}
onValue(ref(db,"listings"),snap=>{window.__listings=snap.val()||{};renderShowcase();});
</script><script src="common-nav.js"></script><script src="hub-enhancements.js"></script>
<script src="marketplace-v3.js"></script>
</body></html>
