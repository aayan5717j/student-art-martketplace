<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artist Profile — Student Art Hub</title><link rel="stylesheet" href="styles.css"><style>
.artist-page{max-width:1100px;margin:auto;padding:30px 18px 60px}.artist-profile-card{position:relative;overflow:hidden;background:linear-gradient(135deg,#fffaf6 0%,#f3e0d3 100%);border:1px solid #ead7c9;border-radius:28px;padding:28px;box-shadow:0 18px 50px rgba(69,43,31,.08);display:flex;gap:22px;align-items:center}.artist-profile-card:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-80px;top:-100px;background:rgba(198,93,59,.1)}.artist-big-avatar{width:112px;height:112px;border-radius:28px;object-fit:cover;background:#fff7f0;display:grid;place-items:center;color:#9b4a32;font-size:40px;font-weight:900;flex:0 0 auto;border:1px solid #ead7c9;position:relative;z-index:1}.artist-profile-card>div:last-child{position:relative;z-index:1}.artist-profile-card h1{margin:4px 0;font-size:clamp(1.65rem,4vw,2.3rem);color:#29231f;letter-spacing:-.03em}.artist-profile-card p{color:#6f625a;margin:6px 0;line-height:1.55}.artist-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.artist-actions .market-btn{background:#fff!important;color:#74402f!important;border:1px solid #d8b9a8!important;border-radius:11px!important;padding:10px 14px!important;text-decoration:none!important;font-weight:800!important}.artist-actions .market-btn:first-child{background:#c65d3b!important;border-color:#c65d3b!important;color:#fff!important}.artist-section{margin-top:28px}.artist-section h2{margin:0 0 5px;color:#29231f;font-size:1.3rem}.artist-section>p{color:#756960;margin-top:0}.request-box{background:#fff;border:1px solid #eaded6;border-radius:22px;padding:22px;margin-top:26px;box-shadow:0 9px 28px rgba(69,43,31,.05)}.request-box h2{margin:0 0 5px;color:#29231f;font-size:1.2rem}.request-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.request-grid .full{grid-column:1/-1}.request-box label{font-size:.78rem;font-weight:800;color:#594b44;display:block;margin:0 0 6px}.request-box input,.request-box textarea,.request-box select{width:100%;box-sizing:border-box;padding:12px 13px;border:1px solid #ddcec5;border-radius:11px;background:#fff;color:#29231f;font-size:.88rem;outline:none}.request-box input:focus,.request-box textarea:focus,.request-box select:focus{border-color:#c65d3b;box-shadow:0 0 0 3px rgba(198,93,59,.1)}.request-box>button{margin-top:14px;background:#29231f!important;color:#fff!important;border:0!important;border-radius:11px!important;padding:12px 17px!important;font-weight:800!important}.rating{display:inline-flex!important;color:#8f5a00!important;background:#fff!important;border:1px solid #ead7c9;border-radius:999px;padding:6px 10px!important;font-size:.78rem}.incoming{margin-top:22px}.order-card{border:1px solid #eaded6;border-radius:14px;padding:14px;margin:10px 0;background:#fffaf6}.order-card p{margin:6px 0 10px;color:#6f625a;line-height:1.5}.order-card button{background:#c65d3b!important;color:#fff!important;border:0!important;border-radius:9px!important;padding:8px 11px!important;font-weight:800!important}.hidden{display:none!important}.artist-section .market-grid{margin-top:16px}
@media(max-width:650px){.artist-page{padding:18px 12px 44px}.artist-profile-card{align-items:flex-start;flex-direction:column;padding:22px}.artist-big-avatar{width:88px;height:88px;border-radius:22px;font-size:32px}.request-grid{grid-template-columns:1fr}.request-grid .full{grid-column:auto}.artist-actions .market-btn{width:100%;text-align:center;box-sizing:border-box}}
</style></head><body>
<main class="artist-page">
<div id="artistProfile" class="artist-profile-card"><div class="artist-big-avatar">🎨</div><div><span class="eyebrow">Student Artist</span><h1>Loading artist...</h1><p>Please wait.</p></div></div>
<section class="artist-section"><h2>Artist Showcase</h2><p>Explore this creator’s original <b>Artist Showcase</b> work and request a custom piece directly.</p><div id="portfolio" class="market-grid"></div></section>
<section class="request-box"><h2>Request a Custom Sketch ✍️</h2><p class="muted">Send your requirements directly to this artist.</p><div class="request-grid"><div><label>Sketch size</label><select id="size"><option>A4</option><option>A3</option></select></div><div><label>Budget (optional)</label><input id="budget" type="number" min="0" placeholder="₹"></div><div class="full"><label>What would you like?</label><textarea id="details" rows="4" placeholder="Portrait, pencil style, reference photo, etc."></textarea></div></div><button id="requestBtn">Send Request</button><p id="requestMsg" class="status-msg"></p></section>
<section id="incoming" class="request-box hidden"><h2>Incoming Custom Requests</h2><div id="incomingList"></div></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";import{getDatabase,ref,get,onValue,push,set}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
const cfg={apiKey:"AIzaSyBxD8SLW9z8ndgAJprcGolqivlNUZVYZxc",authDomain:"art-hub-77eb1.firebaseapp.com",databaseURL:"https://art-hub-77eb1-default-rtdb.firebaseio.com",projectId:"art-hub-77eb1"};const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app);const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const artistId=new URLSearchParams(location.search).get("id");
if(!artistId){$("artistProfile").innerHTML='<div><h1>Artist not found</h1><p class="muted">Open an artist from Custom Sketches.</p><a class="market-btn" href="sketches.html">Back to Custom Sketches</a></div>';throw new Error("missing artist id");}
let artist={};
get(ref(db,"users/"+artistId)).then(s=>{artist=s.val()||{};const a=artist.artistProfile||{};const photo=a.photoUrl?`<img class="artist-big-avatar" src="${esc(a.photoUrl)}" alt="Artist">`:`<div class="artist-big-avatar">${esc((a.name||artist.name||"A").charAt(0).toUpperCase())}</div>`;$("artistProfile").innerHTML=`${photo}<div><span class="eyebrow">Student Artist</span><h1>${esc(a.name||artist.name||"Student Artist")}</h1><p>${esc(a.speciality||"Student Artist")}</p><p>${esc(a.bio||"This artist has not added a bio yet.")}</p><p id="rating" class="rating">⭐ No ratings yet</p><div class="artist-actions"><a class="market-btn" href="sketches.html">← Custom Sketches</a><a class="market-btn" href="profile.html">Manage My Profile</a></div></div>`;});
onValue(ref(db,"ratings/"+artistId),s=>{const arr=Object.values(s.val()||{});const el=$("rating");if(el&&arr.length)el.textContent=`⭐ ${(arr.reduce((n,x)=>n+Number(x.stars||0),0)/arr.length).toFixed(1)} · ${arr.length} reviews`;});
onValue(ref(db,"listings"),s=>{const arr=Object.values(s.val()||{}).filter(x=>x.sellerId===artistId&&x.category==="artist").sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));const box=$("portfolio");box.innerHTML=arr.length?arr.map(x=>`<article class="market-card"><div class="market-image-wrap"><img src="${esc(x.imageUrl||"https://via.placeholder.com/700x500?text=Artist+Sketch")}" alt="${esc(x.title)}"></div><div class="market-card-body"><span class="category-badge">Artist Showcase</span><h3>${esc(x.title||"Untitled")}</h3><p class="market-meta">${esc(x.description||"Student artist showcase")}</p><div class="market-bottom"><strong>₹${esc(x.price||"—")}</strong></div></div></article>`).join(""):'<div class="empty-state"><div>✏️</div><h3>No showcase sketches yet</h3><p>This artist has not uploaded an Artist Showcase listing.</p></div>';});
$("requestBtn").onclick=async()=>{if(!auth.currentUser){$("requestMsg").textContent="Please login first.";return;}const details=$("details").value.trim();if(!details){$("requestMsg").textContent="Please describe your sketch.";return;}const r=push(ref(db,"customOrders"));const data={id:r.key,buyerId:auth.currentUser.uid,artistId,size:$("size").value,budget:$("budget").value||null,details,status:"pending",rated:false,time:Date.now()};await set(r,data);const u=(await get(ref(db,"users/"+artistId))).val()||{};$("requestMsg").textContent=u.whatsapp?"Request saved. Opening WhatsApp...":"Request saved successfully. The artist can see it in their requests.";if(u.whatsapp){const msg=`Hello! I want a custom sketch.\nSize: ${data.size}\nBudget: ${data.budget||"Not specified"}\nDetails: ${data.details}`;window.open(`https://wa.me/${u.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank');}};
onAuthStateChanged(auth,user=>{if(user&&user.uid===artistId){$("incoming").classList.remove("hidden");onValue(ref(db,"customOrders"),s=>{const arr=Object.values(s.val()||{}).filter(x=>x.artistId===artistId&&x.status==="pending");$("incomingList").innerHTML=arr.length?arr.map(x=>`<div class="order-card"><b>${esc(x.size)}</b>${x.budget?` · ₹${esc(x.budget)}`:""}<p>${esc(x.details)}</p><button onclick="completeRequest('${esc(x.id)}')">Mark Completed</button></div>`).join(""): '<p class="muted">No pending requests.</p>';});}});
window.completeRequest=async id=>{await set(ref(db,"customOrders/"+id+"/status"),"completed");};
</script><script src="common-nav.js"></script><script src="hub-enhancements.js"></script>
<script src="marketplace-v3.js"></script>
</body></html>
