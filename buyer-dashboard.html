<!DOCTYPE html>
<html lang="en"><head>
  <script type="module" src="auth-guard.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Orders — Student Art Hub</title><link rel="stylesheet" href="styles.css"><style>
.orders-page{max-width:900px;margin:auto;padding:24px 16px 50px}.orders-hero{background:linear-gradient(135deg,#fffaf6,#f4e2d5);border:1px solid #ead7c9;border-radius:22px;padding:24px;margin-bottom:18px}.orders-hero h1{margin:5px 0;color:#29231f}.orders-hero p{color:#756960;margin:0}.order-list{display:grid;gap:12px}.buyer-order{background:#fff;border:1px solid #eaded6;border-radius:16px;padding:17px;box-shadow:0 8px 24px rgba(69,43,31,.05)}.buyer-order-head{display:flex;justify-content:space-between;gap:12px}.buyer-order h3{margin:6px 0;color:#29231f}.buyer-order .price{font-weight:900;color:#9b4a32}.buyer-order p{color:#6f625a;font-size:.84rem;line-height:1.5}.status{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:.72rem;font-weight:900;text-transform:capitalize}.status.pending{background:#fff0d9;color:#9a5b00}.status.accepted{background:#e7f5e9;color:#21713b}.status.rejected{background:#fde8e7;color:#b42318}.status.completed{background:#e7f0ff;color:#3157d5}.order-note{font-size:.75rem;color:#806f65}.empty{background:#fff;border:1px dashed #d8c6bb;border-radius:16px;padding:30px;text-align:center;color:#756960}@media(max-width:600px){.buyer-order-head{flex-direction:column}}
#myRequestsBox .buyer-order{background:#fffaf6}.response-card{margin-top:12px;padding:11px 12px;border-radius:12px;background:#fff;border:1px solid #eaded6}.response-card p{margin:5px 0}.response-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.response-actions a{display:inline-block;text-decoration:none;background:#29231f;color:#fff;border-radius:9px;padding:8px 11px;font-size:.76rem;font-weight:800}
.response-actions button{display:inline-block;background:#c65d3b;color:#fff;border:0;border-radius:9px;padding:8px 11px;font-size:.76rem;font-weight:800;cursor:pointer}.response-actions button:hover{background:#a94d31}.chosen-response{border-color:#c65d3b;box-shadow:0 0 0 2px rgba(198,93,59,.08)}.request-closed-note{margin-top:12px;padding:10px 12px;border-radius:10px;background:#f4eadf;color:#6f5143;font-size:.78rem;font-weight:800}
</style>
<style>
.request-order-card{position:relative;overflow:hidden}.request-order-card.is-fulfilled{border-color:#d8e7df;box-shadow:0 12px 30px rgba(31,92,65,.08)}.request-meta-line{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.seller-row{display:flex;align-items:center;gap:10px}.seller-avatar{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#29231f,#c65d3b);color:#fff;display:grid;place-items:center;font-weight:900}.seller-info{display:grid;gap:2px;flex:1}.seller-info span{font-size:.72rem;color:#8a776d}.selected-banner{margin-top:12px;padding:13px 14px;border:1px solid #cfe3d8;background:#f0f8f4;border-radius:13px;display:grid;gap:4px;color:#285c45}.selected-banner strong{font-size:.82rem}.selected-banner span{font-size:.72rem;color:#5c7468}.selected-banner a{margin-top:5px;color:#1e6b4d;font-weight:900;text-decoration:none;font-size:.76rem}.wa-btn{display:inline-block;text-decoration:none;background:#217a55;color:#fff;border-radius:9px;padding:8px 11px;font-size:.76rem;font-weight:800}.no-response{padding:10px 2px}.choose-seller-btn:disabled{opacity:.65;cursor:wait}
</style>
</head><body>
<main class="orders-page"><a class="dashboard-back" href="home.html">← Back to Home</a><section class="orders-hero"><span class="eyebrow">Buyer dashboard</span><h1>My Order Requests</h1><p>Track requests you've sent to student sellers.</p></section><section><div id="ordersBox" class="order-list"><div class="empty">Loading your requests…</div></div></section>
<section style="margin-top:20px"><div class="orders-hero"><span class="eyebrow">Community board</span><h2 style="margin:5px 0;color:#29231f">My Posted Requests</h2><p>See which student creators responded to your requirements.</p></div><div id="myRequestsBox" class="order-list"><div class="empty">Loading your posted requests…</div></div></section></main>
<script type="module" src="buyer.js"></script><script src="common-nav.js"></script></body></html>
